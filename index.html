<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueWhale • Selamat Datang</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="landing-page">
    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="gradient-sphere"></div>
        <div class="gradient-sphere-2"></div>
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-water"></i>
                <span>BlueWhale</span>
            </div>
            <div class="nav-links">
                <a href="#features">Features</a>
                <a href="#about">About</a>
                <a href="login.html" class="btn-outline">Login</a>
                <a href="register.html" class="btn-primary">Register</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1 class="glitch-text" data-text="Welcome to BlueWhale">Welcome to <span>BlueWhale</span></h1>
            <p>Modern authentication system with custom verification & bubble notifications</p>
            <div class="hero-buttons">
                <a href="register.html" class="btn-primary btn-large">Get Started <i class="fas fa-arrow-right"></i></a>
                <a href="login.html" class="btn-outline btn-large">Sign In</a>
            </div>
        </div>
        
        <!-- Stats Cards -->
        <div class="stats-container">
            <div class="stat-bubble bubble-blue">
                <i class="fas fa-users"></i>
                <div class="stat-info">
                    <h3>63</h3>
                    <p>Active Users</p>
                </div>
            </div>
            <div class="stat-bubble bubble-green">
                <i class="fas fa-shield-alt"></i>
                <div class="stat-info">
                    <h3>100%</h3>
                    <p>Secure</p>
                </div>
            </div>
            <div class="stat-bubble bubble-purple">
                <i class="fas fa-database"></i>
                <div class="stat-info">
                    <h3>24/7</h3>
                    <p>Protected</p>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
