<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueWhale • Register</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-page">
    <!-- Bubble Notifications Container -->
    <div id="bubbleContainer" class="bubble-container"></div>

    <div class="auth-wrapper">
        <!-- Decorative Elements -->
        <div class="floating-bubble bubble-1"></div>
        <div class="floating-bubble bubble-2"></div>
        <div class="floating-bubble bubble-3"></div>

        <!-- Main Auth Card -->
        <div class="auth-card animate-pop-in">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-water"></i>
                </div>
                <h2>Create Account 🚀</h2>
                <p>Join BlueWhale community</p>
            </div>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
                <div class="form-row">
                    <div class="form-group half">
                        <label>First Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" id="firstName" placeholder="John" required>
                        </div>
                    </div>
                    <div class="form-group half">
                        <label>Last Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" id="lastName" placeholder="Doe" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-at"></i>
                        <input type="text" id="username" placeholder="johndoe123" required>
                        <span class="input-hint" id="usernameHint"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="john@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Create password" required>
                        <i class="fas fa-eye toggle-password" onclick="togglePassword('password', this)"></i>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                        <i class="fas fa-eye toggle-password" onclick="togglePassword('confirmPassword', this)"></i>
                    </div>
                </div>

                <!-- Custom Verification (Bukan Cloudflare) -->
                <div class="verification-box">
                    <div class="verification-header">
                        <i class="fas fa-shield-alt"></i>
                        <span>Security Verification</span>
                    </div>
                    <div class="verification-content">
                        <div class="math-verify" id="mathVerify">
                            <span class="math-question" id="mathQuestion">5 + 3 = ?</span>
                            <input type="number" id="mathAnswer" placeholder="Enter answer">
                            <button type="button" class="verify-btn" onclick="checkMathVerify()">Verify</button>
                        </div>
                        <div class="verification-status" id="verifyStatus">
                            <i class="fas fa-times-circle"></i> Not verified
                        </div>
                    </div>
                </div>

                <div class="terms-check">
                    <label class="checkbox-container">
                        <input type="checkbox" id="termsCheck">
                        <span class="checkmark"></span>
                        I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="auth-btn" id="registerBtn" disabled>
                    <span>Create Account</span>
                    <i class="fas fa-user-plus"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Sign in</a></p>
            </div>
        </div>
    </div>

    <script src="database.js"></script>
    <script src="notifications.js"></script>
    <script src="auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
